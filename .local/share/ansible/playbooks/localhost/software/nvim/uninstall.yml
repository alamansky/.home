---
- name: uninstall nvim 
  hosts: localhost
  vars_files:
    - data.yml
  tasks:
    - name: uninstall binary
      include_tasks:
        file: ../../library/tasks/delete_install_directory.yml
    - name: delete config, state, data, and cache
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - $XDG_CONFIG_HOME/nvim
        - $XDG_STATE_HOME/nvim
        - $XDG_DATA_HOME/nvim
        - $XDG_CACHE_HOME/nvim
