- name: uninstall claude
  hosts: localhost
  vars_files:
    - data.yml
  tasks:
    - name: delete install directory, symlinks, and config
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ destination }}"
        - $HOME/.local/bin/{{ name }}
        - $HOME/.claude
        - $XDG_CONFIG_HOME/claude
    - name: delete env vars
      lineinfile:
        path: $XDG_CONFIG_HOME/zsh/.zshrc
        state: absent
        line: |
          # make claude XDG compliant
          export CLAUDE_CONFIG_DIR="${XDG_CONFIG_HOME:-$HOME/.config}/claude"
