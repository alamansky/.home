- name: create directory
  become: true
  file:
    path: "{{ destination }}"
    state: directory
  when: destination is defined and destination | length > 0
- name: run install script
  become: true
  shell: "{{ command }}"
- name: symlink
  file:
    src: "{{ path }}"
    dest: "$HOME/.local/bin/{{ name }}"
    state: link
  when: path is defined and path | length > 0
